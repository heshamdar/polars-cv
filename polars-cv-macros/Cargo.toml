[package]
name = "polars-cv-macros"
version = "0.28.0"
edition = "2021"
rust-version = "1.96"
description = "Derive for polars-cv's typed op catalogue (internal)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "visit-mut"] }

# Local-dev SIMD flags — x86_64 hosts only.
#
# Enables AVX2/BMI2/FMA auto-vectorization. Measured in release (CR-35 in
# CODE_REVIEW_FINDINGS.md), only the separable blur gains from it, and blur
# now dispatches to an AVX2 build at runtime, so the baseline wheels get that
# gain too. Grayscale, threshold, the fused kernel, cast and resize are as fast
# or faster at the SSE2 baseline the published wheels use.
#
# `x86-64-v3` rather than `native`: native embeds whatever the *build* host's
# CPUID reports, which traps with SIGILL when the process later runs on a host
# without those features (observed with AVX-VNNI under virtualized/heterogeneous
# hosts — the crash kills the whole Python process and cannot be caught). v3
# covers every x86 CPU since ~2015 and retains the vectorization wins above.
#
# Must NOT live under `[build].rustflags`: that applies to every target, and on
# aarch64-apple-darwin it strips the NEON/AES features `ring` asserts at
# compile time (E0080 in cpu/arm/darwin.rs). Scope per x86_64 triple instead.
#
# Cleared in CI/wheel builds via `RUSTFLAGS=""` (see .github/workflows/ci.yml
# and publish.yml) so wheels stay portable. An empty CARGO_BUILD_RUSTFLAGS is
# treated as unset and falls back to this file — use RUSTFLAGS.
#
# `-fuse-ld=lld` (linux-gnu only): linking the plugin cdylib means linking the
# whole polars stack — hundreds of MB of objects — and the default `ld.bfd` is
# the slowest single step of the `maturin develop` dev loop. lld cuts that
# final link from tens of seconds to a few, and re-links every iteration. It is
# scoped to this one triple on purpose: the web/remote container and most Linux
# dev boxes ship `lld` (else `apt install lld`), but a mac/windows dev may not,
# and gcc/cc errors rather than degrades when `-fuse-ld=lld` finds no lld. Like
# `target-cpu`, `RUSTFLAGS=""` clears it in CI/wheels.

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v3"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v3"]

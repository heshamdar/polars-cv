[package]
name = "jpeg-encode-eval"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone on purpose: jpeg-encoder is IJG-licensed, and the workspace's
# `cargo deny` checks dev-dependencies too, so the eval must not add it to
# view-buffer unless it is adopted (the owner's decision).
[workspace]

[dependencies]
image = { version = "=0.25.9", default-features = false, features = ["jpeg"] }
jpeg-encoder = { version = "0.7", features = ["simd"] }

[profile.release]
debug = false

[package]
name = "polars-cv"
version = "0.11.0"
edition = "2021"
# Bumped by the polars 0.54 upgrade: polars-ooc needs cold_path/atomic_try_update,
# stabilized in Rust 1.96. cargo errors clearly on older toolchains instead of E0658.
rust-version = "1.96"
description = "A Polars plugin for vision/array operations powered by view-buffer"
license = "MIT OR Apache-2.0"

[lib]
name = "polars_cv"
crate-type = ["cdylib"]

[dependencies]
# Core library - use serde feature for pipeline serialization
# NOTE: Do NOT enable "python" feature to avoid pyo3 version conflict
view-buffer = { path = "../view-buffer", default-features = false, features = [
    "arrow_interop",
    "polars_interop",
    "image_interop",
    "perceptual_hash",
    "ndarray_interop",
    "serde",
] }

# Polars plugin essentials - use pyo3 0.28 which is compatible with pyo3-polars 0.27
# Note: dtype-i8/dtype-u8/dtype-i16/dtype-u16 required for Int8/UInt8/Int16/UInt16 Series
# See: https://github.com/pola-rs/polars/issues/24171
polars = { version = "0.54", default-features = false, features = [
    "dtype-array",
    "dtype-struct",
    "dtype-i8",
    "dtype-u8",
    "dtype-i16",
    "dtype-u16",
    "object",
    "strings",
    # Required to pull in the optional polars-time dependency: polars-expr's
    # "strings" feature unconditionally imports polars_time::prelude::StringMethods
    # without enabling polars-time itself (upstream feature-graph gap).
    "dtype-datetime",
] }
polars-arrow = { version = "0.54" }
polars-buffer = { version = "0.54" }
pyo3 = { version = "0.28" }
pyo3-polars = { version = "0.27", features = ["derive", "lazy"] }

# Image encoding support
image = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Cloud storage support (S3, GCS, Azure)
object_store = { version = "0.12", features = ["aws", "gcp", "azure"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = { version = "2" }

# HTTP support for URL sources (http://, https://)
# Uses async client within tokio runtime (same as cloud storage)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
jpeg-decoder = "0.3"

[features]
pyo3-extension = ["pyo3/extension-module", "pyo3/abi3-py39"]

[dev-dependencies]
# For testing
polars = { version = "0.54", features = ["dtype-array", "dtype-struct", "lazy", "object", "strings", "dtype-datetime"] }

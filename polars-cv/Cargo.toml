[package]
name = "polars-cv"
version = "0.23.0"
edition = "2021"
# Bumped by the polars 0.54 upgrade: polars-ooc needs cold_path/atomic_try_update,
# stabilized in Rust 1.96. cargo errors clearly on older toolchains instead of E0658.
rust-version = "1.96"
description = "A Polars plugin for vision/array operations powered by view-buffer"
license = "MIT OR Apache-2.0"

[lib]
name = "polars_cv"
crate-type = ["cdylib"]

[dependencies]
# Core library - use serde feature for pipeline serialization
# NOTE: Do NOT enable "python" feature to avoid pyo3 version conflict
view-buffer = { path = "../view-buffer", default-features = false, features = [
    "arrow_interop",
    "polars_interop",
    "image_interop",
    "perceptual_hash",
    "ndarray_interop",
    "serde",
] }

# Polars plugin essentials - use pyo3 0.28 which is compatible with pyo3-polars 0.27
# Note: dtype-i8/dtype-u8/dtype-i16/dtype-u16 required for Int8/UInt8/Int16/UInt16 Series
# See: https://github.com/pola-rs/polars/issues/24171
polars = { version = "0.54", default-features = false, features = [
    "dtype-array",
    "dtype-struct",
    "dtype-i8",
    "dtype-u8",
    "dtype-i16",
    "dtype-u16",
    "object",
    "strings",
    # Required to pull in the optional polars-time dependency: polars-expr's
    # "strings" feature unconditionally imports polars_time::prelude::StringMethods
    # without enabling polars-time itself (upstream feature-graph gap).
    "dtype-datetime",
    # Cloud transport is *delegated* to polars-io rather than reimplemented here.
    # These unlock `polars::io::cloud`: `build_object_store` and its process-wide
    # store cache, `PolarsObjectStore` (credential-expiry rebuild-and-retry), the
    # credential-provider machinery, and `pl_async`'s global concurrency budget.
    # Every one of those is process-wide there and was per-file here, which is
    # why this plugin opened a fresh connection for every image it read.
    #
    # `polars-io` was already in the build graph (the `object` and `dtype-*`
    # features pull it in, and `polars` re-exports it as `polars::io`), but
    # `cloud/mod.rs` gates the useful half behind `feature = "cloud"`.
    # aws/gcp/azure each imply `cloud` + `async`.
    #
    # `http` is deliberately NOT enabled: polars does not cache HTTP object
    # stores (only Aws/Gcp/Azure take a cache key), and we read many small files
    # rather than a few large ones, so `http(s)://` keeps its own pooled client
    # in `cloud.rs`.
    "aws",
    "gcp",
    "azure",
] }
polars-arrow = { version = "0.54" }
polars-buffer = { version = "0.54" }
# `PlRefPath` / `CloudScheme` — the path types `build_object_store` and
# `CloudOptions::from_untyped_config` take. Declared directly rather than reached
# through `polars::polars_utils`, which is `#[doc(hidden)]`; the lockfile pins
# both to the same version regardless.
polars-utils = { version = "0.54" }
pyo3 = { version = "0.28" }
pyo3-polars = { version = "0.27", features = ["derive", "lazy"] }

# Image encoding support
image = "0.25"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Half-precision (f16) output downcast for the numpy/torch sink. The engine has
# no native f16 dtype, so f16 is produced only at the encode boundary.
half = "2"

# Error handling
thiserror = "1.0"

# Cloud storage support (S3, GCS, Azure)
# NOTE: 0.13+ is required. In object_store 0.12 the GCS builder unconditionally
# reads and parses Application Default Credentials (GOOGLE_APPLICATION_CREDENTIALS
# or the well-known gcloud file) inside build(), *before* honoring an explicit
# credential provider. That makes the `gcs_bearer_token` escape hatch fail when
# the ambient ADC is a federated `external_account_authorized_user` credential
# object_store cannot parse. 0.13 guards the read behind
# `service_account_credentials.is_none() && self.credentials.is_none()`. Also
# dedupes with polars 0.54, which already pulls object_store 0.13.
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
url = { version = "2" }
# The fan-out in `read_files_concurrent`. `buffer_unordered` rather than a
# thread pool: the reads are IO-bound futures on a shared runtime, and the
# process-wide semaphore is what bounds them.
futures = "0.3"

# HTTP support for URL sources (http://, https://)
# Uses async client within tokio runtime (same as cloud storage)
#
# `rustls-tls` is load-bearing for more than our own `http(s)://` reads:
# polars-io declares reqwest with `default-features = false, features = ["json"]`
# and no TLS backend at all, so feature unification means *this* line is what
# gives object_store's S3/GCS/Azure clients HTTPS. Dropping it would leave every
# cloud read failing at runtime with a missing-TLS-backend error.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
jpeg-decoder = "0.3"

[features]
pyo3-extension = ["pyo3/extension-module", "pyo3/abi3-py39"]

[dev-dependencies]
# For testing
polars = { version = "0.54", features = ["dtype-array", "dtype-struct", "lazy", "object", "strings", "dtype-datetime"] }

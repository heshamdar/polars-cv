site_name: polars-cv
site_description: High-performance vision/array processing for Polars DataFrames
site_url: https://github.com/heshamdar/polars-cv

repo_name: heshamdar/polars-cv
repo_url: https://github.com/heshamdar/polars-cv
edit_uri: ""

theme:
  name: material
  logo: assets/logo/polars-cv-halftone-mark.png
  favicon: assets/logo/polars-cv-halftone-mark.png
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            show_source: false
            docstring_style: google
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            # The typed-op builder methods are generated into `_OpsMixin`,
            # which `Pipeline` inherits; without this they vanish from the API.
            inherited_members: true
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # The changelog lives at the repo root; docs/changelog.md embeds it so the
      # site and the repo cannot drift.
      base_path: [".", ".."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quickstart: getting-started/quickstart.md
  - User Guide:
    - Concepts:
      - Pipelines: user-guide/concepts/pipelines.md
      - Sources: user-guide/concepts/sources.md
      - Parameters & Errors: user-guide/concepts/parameters.md
      - Domains: user-guide/concepts/domains.md
      - Streaming & Scaling: user-guide/concepts/streaming.md
      - Extension Types: user-guide/concepts/extension-types.md
    - Operations:
      - Image Operations: user-guide/operations/image-ops.md
      - Geometry: user-guide/operations/geometry.md
      - Hashing: user-guide/operations/hashing.md
      - Reductions: user-guide/operations/reductions.md
      - Detection Metrics: user-guide/operations/metrics.md
      - Metadata & Display: user-guide/operations/metadata.md
    - Composition:
      - Chaining: user-guide/composition/chaining.md
      - Multi-Output: user-guide/composition/multi-output.md
      - Binary Operations: user-guide/composition/binary-ops.md
    - Drawing: user-guide/drawing.md
  - API Reference:
    - Pipeline: api/pipeline.md
    - LazyPipelineExpr: api/lazy.md
    - Expressions (.cv): api/expressions.md
    - Geometry: api/geometry.md
    - Metrics: api/metrics.md
    - Functions: api/functions.md
  - Migration Guides:
    - Overview: user-guide/migration.md
    - From 0.37 to 0.38: user-guide/migration-0.38.md
    - From 0.36 to 0.37: user-guide/migration-0.37.md
    - From 0.35 to 0.36: user-guide/migration-0.36.md
    - From 0.34 to 0.35: user-guide/migration-0.35.md
    - From 0.33 to 0.34: user-guide/migration-0.34.md
    - From 0.32 to 0.33: user-guide/migration-0.33.md
    - From 0.31 to 0.32: user-guide/migration-0.32.md
    - From 0.30 to 0.31: user-guide/migration-0.31.md
    - From 0.29 to 0.30: user-guide/migration-0.30.md
    - From 0.28 to 0.29: user-guide/migration-0.29.md
  - Changelog: changelog.md

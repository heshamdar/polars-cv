[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "polars-cv"
version = "0.28.0"
description = "A Polars plugin for vision/array operations"
authors = [{ name = "Hesham Dar", email = "heshamdar@gmail.com" }]
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "polars>=1.0,<2.0",
    "graphviz>=0.21",
    "pydot>=4.0.1",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "opencv-python>=4.8",
    "scipy>=1.10",
    "imagehash>=4.3",
    "pillow>=10.0",
    "jupyterlab-execute-time>=3.3.0",
    "jupytext>=1.18.1",
    "ruff>=0.9.0",
    "maturin>=1.7,<2.0",
    "pre-commit>=4.5.1",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    # Ten of the thirteen runnable examples plot their results, and
    # `test_examples_run` executes all thirteen. Without this they would not
    # skip, they would fail: the runner asserts exit 0.
    "matplotlib>=3.9.4",
]
bench = [
    "opencv-python>=4.8",
    "pillow>=10.0",
    "torch>=2.0",
    "torchvision>=0.15",
    "rich>=13.0",
    "psutil>=5.9",
    "numpy>=1.20",
    "matplotlib>=3.9.4",
    "jupyterlab",
    "datasets>=2.0",
]
docs = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
    "ruff",
]


[tool.maturin]
python-source = "python"
module-name = "polars_cv._lib"
features = ["pyo3-extension"]
# Note: manylinux compatibility and universal2 are handled by CI workflow (publish.yml)


[tool.pytest.ini_options]
markers = [
    "network: mark a test that requires network access",
    "slow: mark a test as slow (excluded from default CI run)",
    "structural: mark a guard that checks codebase shape rather than runtime behaviour (needs no compiled extension, so pre-commit can run it)",
]

# Coverage is *not* enabled in addopts on purpose: the fail-under gate below
# must apply only to the full behavioural lane, not to the structural-only
# subset the pre-commit hook runs (which cannot reach 95% by design) nor to the
# slow lane run alone. scripts/verify.sh and CI pass `--cov=polars_cv
# --cov-fail-under=95` on the streaming fast lane specifically.
[tool.coverage.run]
source_pkgs = ["polars_cv"]
omit = [
    # Pure visual-output glue with no headless assertion surface: notebook image
    # rendering (`show_images`) and DAG visualisation through the optional
    # networkx/graphviz/pydot backends. Both are exercised by hand and by the
    # docs, not by the behavioural suite; measuring them would gate the build on
    # rendering code that produces pictures, not values.
    "*/polars_cv/display.py",
    "*/polars_cv/_graph_viz.py",
]

[tool.coverage.paths]
# Unify the editable checkout (python/polars_cv, what `maturin develop` installs)
# with any site-packages copy, so the report reads as one tree in every install.
polars_cv = ["python/polars_cv", "*/site-packages/polars_cv"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "^\\s*\\.\\.\\.$",
]
fail_under = 95
show_missing = true

[tool.ty]
# Scoped to the shipped, py.typed package surface. Tests are intentionally out
# of scope for the first gate: they lean on the dynamically registered `.cv` /
# `.point` / `.contour` expression namespaces, which a static checker cannot see
# without namespace stubs. Widen to `tests` once those exist.
#
# Pre-existing findings are baselined with inline `# ty: ignore[<rule>]` comments
# (ty 0.0.82 is strict about polars' own stub overloads, the dynamically
# registered expression namespaces, and `sink()`'s `Expr | PipelineGraph` union
# return — all runtime-correct here). The gate therefore enforces *no new* type
# errors; whittle the baselined ignores down over time.
[tool.ty.src]
include = ["python/polars_cv"]
# lazy.py builds LazyPipelineExpr's chainable API by setattr at import time, so
# its type surface lives in the generated lazy.pyi (kept in sync by
# test_lazy_stub_is_current). Checking the .py *and* its sibling .pyi makes ty
# treat the two as distinct nominal classes; the stub is the checked contract,
# so exclude the implementation and let importers resolve against the stub.
exclude = ["python/polars_cv/lazy.py"]

[tool.ty.environment]
python-version = "3.10"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["python"]
extend-exclude = ["benchmarks", "examples", "docs"]

# Conservative, enforceable baseline that the current code already satisfies:
# pyflakes (F), pycodestyle errors (E), and import sorting (I). Broader rule
# families (UP, B, C4, RUF) can be adopted incrementally later.
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",   # line length is handled by the formatter
]

[package]
name = "view-buffer"
version = "0.3.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A zero-copy, stride-aware tensor orchestration framework for Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/heshamdar/view-buffer"
keywords = ["tensor", "zero-copy", "arrow", "ndarray", "image"]
categories = ["science", "data-structures", "computer-vision"]

# NEW: Required for Maturin/Python to load the shared library
[lib]
name = "view_buffer"
crate-type = ["cdylib", "rlib"]

[dependencies]
thiserror = "1.0"
num-traits = "0.2"

# Optional dependencies
ndarray = { version = "0.15", optional = true }
image = { version = "0.24", optional = true }
arrow = { version = "53.0", features = ["ffi"], optional = true }

# Python Bindings
pyo3 = { version = "0.27.2", features = ["extension-module"], optional = true }

# NEW: Serialization & Protocol dependencies (Phase 1)
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
bytemuck = { version = "1.14", features = ["derive"], optional = true }

[dev-dependencies]
anyhow = "1.0"
ndarray = "0.15"
image = "0.24"
arrow = { version = "53.0", features = ["ffi"] }
# Added for tests
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
# No interops by default - minimal core for fast compilation
default = []

# External crate interops (require dependencies)
ndarray_interop = ["dep:ndarray"]
image_interop = ["dep:image"]
arrow_interop = ["dep:arrow"]

# Output format support (no external deps, just format logic)
numpy_interop = []
torch_interop = []

# Convenience bundles
all_interops = [
    "ndarray_interop",
    "image_interop",
    "arrow_interop",
    "numpy_interop",
    "torch_interop",
]

# Python bindings
python = ["dep:pyo3"]

# Serialization support
serde = ["dep:serde", "dep:serde_json", "dep:bytemuck"]

[[example]]
name = "demo"
required-features = ["image_interop"]

[[example]]
name = "comprehensive_demo"
required-features = ["image_interop"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
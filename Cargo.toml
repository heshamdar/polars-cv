# Root Cargo.toml
[workspace]
members = ["view-buffer", "polars-cv", "polars-cv-macros"]
resolver = "2"

# Every `unsafe` block states, in a `// SAFETY:` comment, the invariant it
# relies on and the code that establishes it. `deny`, so `-D warnings` is not
# the only thing standing between a bare block and the tree.
# The one declaration of the `image` crate, which both crates take with
# `workspace = true`: features unify across the workspace, so a second entry
# with defaults would compile every codec back in for both.
#
# The features are the formats a source decodes, named one by one, plus
# `rayon`. Left out of `image`'s defaults:
# - `avif`: an encoder only (`ravif`, which builds `rav1e`). No sink writes
#   AVIF, and decoding it is another feature (`avif-native`, a C library).
# - `tga`: Truevision files have no signature, and every decode here detects
#   the format from the bytes, so no input ever reached that decoder.
# `rayon` stays: among these formats only OpenEXR uses it, and without it a
# 2048x2048 EXR decoded in about 255 ms against 170 ms (one row), 945 ms
# against 880 ms (16 rows, 4 cores; 2026-11-12, `--profile benchmark`). It
# decodes on rayon's global pool, not polars' pool the rows are split over.
# `tests/test_decode_formats.py` decodes a committed file per feature and
# holds this list, those files and the documented table to one another.
[workspace.dependencies]
image = { version = "0.25", default-features = false, features = [
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png",
    "pnm", "qoi", "tiff", "webp",
    "rayon",
] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

# Workspace-level profile settings
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Use "unwind" to allow catch_unwind for graceful error handling in polars-cv plugin.
# Ops validate their input first (`Op::validate`), so a panic is an engine bug;
# unwinding lets the executor catch one per row and report it as an error
# instead of aborting the Python process.
panic = "unwind"
strip = true

# Benchmark profile — `maturin develop --profile benchmark`. Release, minus the
# fat-LTO link: a release build of this stack takes 10-18 minutes, almost all of
# it the single-codegen-unit fat-LTO link of the polars stack, while comparing
# two commits only needs the kernels optimised the same way on both sides.
# Inheriting release keeps `panic = "unwind"` and `opt-level` from drifting.
# Absolute numbers can differ slightly from a fat-LTO wheel; a base-vs-head
# comparison built with this profile on both sides is what it is for.
[profile.benchmark]
inherits = "release"
lto = "thin"
codegen-units = 16

# Dev profile — this is what `maturin develop`, `cargo test`, clippy and
# `scripts/verify.sh` build, i.e. the one build the whole dev loop pays for. It
# is tuned for iteration speed and disk footprint, never runtime speed (that is
# `--profile benchmark` for benchmarks, `--release` for wheels).
[profile.dev]
# Line-table debuginfo only. Backtraces keep file:line, but the polars stack's
# full `debug = 2` DWARF — the single largest contributor to target/debug — is
# dropped. Smaller artifacts, faster codegen.
debug = 1
# Keep debuginfo in sidecar files instead of the object/cdylib, so the final
# link of the large plugin .so does not have to copy it every rebuild.
split-debuginfo = "unpacked"

# ...except for the workspace's own crates, which keep theirs inline. They are
# the crates that rebuild incrementally, and each incremental rebuild writes
# its sidecars under new names while cargo never deletes the old: a session of
# edits left ~79,000 stale `.dwo` files (about 12 GB) in target/debug/deps.
# The dependencies compile once per configuration and leak nothing. Inline,
# our crates' line tables are a small copy at link time: measured, a rebuild
# after a plugin edit took ~10 s against ~11.5 s all-unpacked (and ~21 s with
# `off` for the whole stack), the .so 453 MB against 403 MB.
# `test_build_efficiency.py` holds every workspace member to it.
[profile.dev.package.view-buffer]
split-debuginfo = "off"

[profile.dev.package.polars-cv]
split-debuginfo = "off"

[profile.dev.package.polars-cv-macros]
split-debuginfo = "off"

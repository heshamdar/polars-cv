# Interactive Linux build environment for polars-cv. Run from the repository
# root: `docker compose -f docker/compose.yaml up -d builder`.
services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: polars-cv-builder:latest
    volumes:
      # The repository root, mounted for development
      - ..:/workspace
      # Cache Rust dependencies across container restarts
      - cargo-cache:/usr/local/cargo/registry
      - cargo-git-cache:/usr/local/cargo/git
    working_dir: /workspace
    environment:
      - CARGO_TERM_COLOR=always
      - RUST_BACKTRACE=1
    # Keep the container running for interactive use
    command: tail -f /dev/null

volumes:
  cargo-cache:
  cargo-git-cache:

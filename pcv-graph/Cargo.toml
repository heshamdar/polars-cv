[package]
name = "pcv-graph"
version = "0.9.0"
edition = "2021"

[dependencies]
view-buffer = { path = "../view-buffer", default-features = false, features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2", features = ["serde"] }
inventory = "0.3"
thiserror = "1"

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "dump_schema"
path = "src/bin/dump_schema.rs"

name: Build and Publish to PyPI

on:
  release:
    types: [created]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Clear .cargo/config.toml's per-x86_64 `target-cpu=x86-64-v3` rustflags so
  # published wheels are portable (no AVX2/BMI2/FMA requirement baked in).
  # RUSTFLAGS (not CARGO_BUILD_RUSTFLAGS) is required: an empty
  # CARGO_BUILD_RUSTFLAGS is treated as unset and falls back to the config file.
  RUSTFLAGS: ""

jobs:
  # What gets published is decided by the manifests, not by the tag — maturin
  # reads `polars-cv/pyproject.toml`, and the tag is only a label on a commit.
  # So a release tagged `v0.20.0` cut before the version bump landed would build
  # and upload `polars_cv-0.19.0` under a 0.20.0 release, or fail at the very
  # end with PyPI's "file already exists". Nothing checked the two against each
  # other. This does, before any wheel is built.
  #
  # `polars-cv/pyproject.toml` is read as the one version source. The other
  # three (both Cargo.toml files and `polars_cv.__version__`) are pinned to it
  # by `test_version_consistency.py`, which `ci.yml` runs on every push to main
  # — restating that comparison here would be a second authority for the same
  # fact, and the manifests are already checked by the time a release is cut.
  check-version:
    name: Tag matches the declared version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.declared.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Required, not cosmetic. A bare `ubuntu-latest` runner has
      # `/usr/bin/python3` but no `python` on PATH, and the read below needs
      # `tomllib` (3.11+). Pinned to the same 3.12 the build jobs use.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read the declared version
        id: declared
        shell: bash
        run: |
          version="$(python -c '
          import pathlib, tomllib
          manifest = pathlib.Path("polars-cv/pyproject.toml").read_bytes()
          print(tomllib.loads(manifest.decode())["project"]["version"])
          ')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "polars-cv/pyproject.toml declares $version"

      - name: Compare against the release tag
        # Only a `release` event carries a tag. A manual `workflow_dispatch`
        # publishes whatever the checked-out ref declares, which is the point of
        # having the escape hatch — it is reported rather than silently skipped.
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.declared.outputs.version }}
        run: |
          if [[ "$TAG" != "v$VERSION" && "$TAG" != "$VERSION" ]]; then
            echo "::error::release tag '$TAG' does not match the declared version '$VERSION'."
            echo "Bump the version in all six places (see CONTRIBUTING.md) and re-tag,"
            echo "or delete and recreate the release with tag 'v$VERSION'."
            exit 1
          fi
          echo "tag '$TAG' matches declared version '$VERSION'."

      - name: Report an unverified manual run
        if: github.event_name != 'release'
        run: |
          echo "::warning::workflow_dispatch run — publishing version \
          ${{ steps.declared.outputs.version }} from ${{ github.ref }} with no tag to check it against."

  build-wheels:
    name: Build wheels (${{ matrix.target }})
    needs: [check-version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux x86_64 (manylinux2014). The `interpreter` pin is required: the
          # manylinux build container defaults to Python 3.8, which is below the
          # crate's abi3-py39 floor, so maturin silently falls back to a
          # version-locked cp38 wheel. Pinning a >=3.9 interpreter makes maturin
          # emit a portable cp39-abi3 wheel, matching the macOS build.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux2014
            interpreter: "-i python3.12"
          # Linux aarch64 (manylinux2014) — same abi3 interpreter pin as above.
          - os: ubuntu-24.04-arm
            architecture: aarch64
            target: aarch64-unknown-linux-gnu
            manylinux: manylinux2014
            interpreter: "-i python3.12"
          # macOS arm64. The host Python (3.12) is already >= the abi3-py39 floor,
          # so maturin produces a cp39-abi3 wheel without an explicit interpreter.
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: ${{ matrix.target }}

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.interpreter }} --manifest-path polars-cv/Cargo.toml
          manylinux: ${{ matrix.manylinux }}
          container: ${{ matrix.container }}

      # Guard against regressing to version-locked (cpXX-cpXX) wheels. Every
      # wheel we ship must be a portable abi3 wheel so a single artifact covers
      # all supported Python versions on every platform.
      - name: Verify wheels are abi3
        shell: bash
        run: |
          shopt -s nullglob
          fail=0
          for whl in dist/*.whl; do
            echo "Built: $(basename "$whl")"
            if [[ "$(basename "$whl")" != *"-abi3-"* ]]; then
              echo "::error::Wheel is not abi3 (version-locked): $(basename "$whl")"
              fail=1
            fi
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "Expected only abi3 wheels (e.g. cp39-abi3-...); see errors above."
            exit 1
          fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    needs: [check-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        working-directory: polars-cv
        run: maturin sdist --out ../dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/polars-cv/
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

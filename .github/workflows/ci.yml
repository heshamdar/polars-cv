name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow the slow/OOC lane to be kicked manually and run on a weekly cadence.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Clear .cargo/config.toml's per-x86_64 `target-cpu=x86-64-v3` rustflags so
  # CI builds are portable and reproducible. RUSTFLAGS (not CARGO_BUILD_RUSTFLAGS)
  # is required: an empty CARGO_BUILD_RUSTFLAGS is treated as unset and falls
  # back to the config file, leaving target-cpu baked in on x86_64 runners.
  RUSTFLAGS: ""

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run only ubuntu-latest on PRs to save costs
        # Run full matrix on main branch
        os: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
            && fromJSON('["ubuntu-latest", "macos-latest"]')
            || fromJSON('["ubuntu-latest"]')
          }}
        # Full supported range: the package advertises 3.10-3.13 but CI used to
        # test only 3.13. abi3 means the matrix is a test-only cost, not extra
        # wheels. The behavioural lane here runs under the default (streaming)
        # engine; the dual-engine and coverage gates live in dedicated jobs below.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Installed *before* the Rust cache is restored, because the cache key
      # below depends on which Python this resolves to.
      - name: Install Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          # Keyed on the *exact* interpreter, not the "3.13" we asked for.
          #
          # `cargo test` below builds polars-cv without the pyo3-extension
          # feature, so its test binary links libpython, and pyo3's build script
          # bakes the interpreter's libdir into the cached artifacts as an
          # absolute path. When the hosted image bumps its Python patch version,
          # that path stops existing while the rest of the cache still looks
          # fresh to cargo — so the build script never re-runs and the link fails
          # with `unable to find library -lpython3.13`, searching a
          # `.../Python/3.13.14/x64/lib` that is no longer there. The cache is
          # only valid for the Python it was built against; the key now says so.
          #
          # `steps.setup_python.outputs.python-version` is the resolved version
          # (e.g. 3.13.15), which is the whole point — `matrix.python-version` is
          # "3.13" and would not change on the bump that breaks this.
          key: py-${{ steps.setup_python.outputs.python-version }}

      - name: Test view-buffer (all features)
        # The main "Build and Test" step runs from the polars-cv crate dir, so it
        # only tests that crate with default features — view-buffer's feature-gated
        # modules (image_interop/arrow/polars/perceptual_hash/serde) are never
        # exercised. Run them explicitly. Scoped to -p view-buffer so polars-cv's
        # pyo3-extension feature (which unlinks libpython) is not activated.
        run: cargo test -p view-buffer --all-features

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Determine package directory
        id: package_dir
        shell: bash
        run: |
          if [ -d "polars-cv" ]; then
            echo "dir=polars-cv" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.package_dir.outputs.dir }}
        run: |
          # --no-install-project: a plain `uv sync` builds+installs polars-cv
          # via its maturin backend at the workspace release profile (fat LTO) —
          # a multi-minute compile of the whole polars stack that the
          # `maturin develop` (debug) step below immediately overwrites. Sync
          # only the dependency groups; the debug build is the single source of
          # the extension, matching scripts/verify.sh and the dev loop.
          uv sync --group dev --no-install-project

      - name: Build and Test (Rust & Python)
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        # This step builds the extension (`maturin develop`), so a *missing*
        # extension here is a real failure, not a not-yet-built skip. The flag
        # makes `test_plugin_is_present_when_required` assert `_lib` is importable
        # instead of letting the whole @plugin_required structural sweep skip.
        env:
          POLARS_CV_REQUIRE_PLUGIN: "1"
        run: |
          source .venv/bin/activate

          echo "=== Running Rust Tests ==="
          cargo test

          echo "=== Building Python Extension ==="
          # Build with all features enabled (cloud support is now default)
          maturin develop

          echo "=== Running Structural Guards ==="
          # The lane the pre-commit hook runs, given its own exit code so a
          # broken ratchet is distinguishable from a behavioural failure in the
          # much larger lane below. It is a subset of that lane, so this costs
          # about five seconds and duplicates no coverage.
          #
          # It runs *here*, after `maturin develop`, and not in the lint job:
          # 427 of these 651 tests are `@plugin_required`, and without the
          # extension they do not politely skip -- sixteen fail outright and
          # `test_schema_parity_chains.py` aborts collection, because its
          # `parametrize` reads `enum_variants` from `_lib` at import time.
          pytest tests/ -q -m "structural and not slow"

          echo "=== Running Python Tests ==="
          # Exclude network-marked tests: they hit external services (httpbin.org)
          # and flake when those are down (e.g. HTTP 503), which with -x aborts the
          # whole suite. Run them out-of-band, not as a CI gate.
          # Exclude slow-marked tests (e.g. test_streaming_ooc.py): heavier,
          # subprocess-based out-of-core verification not needed on every PR.
          pytest tests/ -x -v --tb=short -m "not network and not slow"

  dependency-floors:
    # The locked environment tests the newest versions; this job tests the
    # oldest ones pyproject.toml claims, on the oldest supported Python
    # (CR-44). `scripts/dependency_floors.py` reads the floors from
    # `[project] dependencies`, so the claim and the test cannot drift apart.
    name: Test declared dependency floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: floors-py-${{ steps.setup_python.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies at their declared floors
        working-directory: polars-cv
        run: |
          uv sync --group dev --no-install-project
          uv pip install $(.venv/bin/python scripts/dependency_floors.py)

      - name: Build and Test
        working-directory: polars-cv
        env:
          POLARS_CV_REQUIRE_PLUGIN: "1"
        run: |
          source .venv/bin/activate
          maturin develop
          pytest tests/ -x -q --tb=short -m "not network and not slow"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check formatting and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Python Lint (Ruff)
        run: |
          if [ -d "polars-cv" ]; then cd polars-cv; fi
          uvx ruff check python tests benchmarks
          uvx ruff format --check python tests benchmarks

  docs:
    name: Docs build
    # The docs had no CI at all: `docs.yml` is `workflow_dispatch:`-only, so a
    # broken link or a nav entry pointing at a deleted page was only found by
    # someone manually deploying. This builds on every push and PR, and with
    # `--strict` so a warning fails rather than scrolling past.
    #
    # Deliberately in `ci.yml` rather than as a second trigger on `docs.yml`:
    # `test_verify_script_covers_every_ci_check` reads this file to check that
    # `scripts/verify.sh` runs everything CI does, so a check placed anywhere
    # else is one it cannot see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Build MkDocs site (strict)
        run: |
          if [ -d "polars-cv" ]; then cd polars-cv; fi
          # --no-install-project: the docs build imports nothing from the
          # compiled extension — mkdocstrings reads the Python source statically
          # (`paths: [python]`, griffe). Building+installing the project here
          # would compile the whole release-LTO extension for a docs-only job.
          uv sync --group docs --no-install-project
          uv run --no-sync mkdocs build --strict

  typing:
    name: Typing (ty)
    # Static type check of the shipped, py.typed package (config in
    # polars-cv/pyproject.toml under [tool.ty]). ty reads the source and the
    # committed .pyi stubs, so it needs the dev deps synced (polars/numpy import
    # resolution) but no compiled extension.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: ty check
        # `--project polars-cv` is the same invocation scripts/verify.sh and the
        # pre-commit hook use (one spelling of the gate, run from the repo root).
        run: |
          uv sync --directory polars-cv --group dev --no-install-project
          uvx ty check --project polars-cv

  cargo-deny:
    name: cargo-deny (advisories + licenses)
    # Supply-chain / license gate over the whole dependency graph (the cloud
    # transports pull in a large tree). Config in deny.toml at the repo root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A `uses:` step, deliberately not `run: cargo install`: an install line
      # would be an unclassified command the verify-script parity guard rejects.
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo deny check
        run: cargo deny check

  dual-engine-and-coverage:
    name: Dual engine + coverage
    # The behavioural suite under BOTH query engines (they chunk a plugin's
    # inputs differently, so a chunk-boundary bug hides under one), plus the 95%
    # coverage gate on the streaming lane. The `test` matrix above already runs
    # streaming across every Python; this pins the in-memory half and the gate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: py-${{ steps.setup_python.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Determine package directory
        id: package_dir
        shell: bash
        run: |
          if [ -d "polars-cv" ]; then
            echo "dir=polars-cv" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.package_dir.outputs.dir }}
        run: uv sync --group dev --no-install-project

      - name: Build extension
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        run: |
          source .venv/bin/activate
          maturin develop

      - name: Streaming lane + coverage gate
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        env:
          POLARS_CV_REQUIRE_PLUGIN: "1"
        # Streaming is the default engine (conftest sets POLARS_ENGINE_AFFINITY);
        # --cov enforces the 95% floor (fail_under in pyproject).
        run: |
          source .venv/bin/activate
          pytest tests/ -q -m "not network and not slow" --cov=polars_cv

      - name: In-memory lane
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        env:
          POLARS_CV_REQUIRE_PLUGIN: "1"
          POLARS_ENGINE_AFFINITY: in-memory
        run: |
          source .venv/bin/activate
          pytest tests/ -q -m "not network and not slow"

  slow-tests:
    name: Slow / OOC tests
    # Off the per-PR critical path: the slow-marked tests (e.g.
    # test_streaming_ooc.py) spawn subprocesses for out-of-core verification.
    # Run them on manual dispatch and the weekly schedule instead.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Same ordering and the same cache key as the `test` job, for the same
      # reason — see the comment there. This job only builds through `maturin
      # develop`, which does not link libpython, so it has not been seen to
      # fail; it caches Python-dependent build-script output all the same.
      - name: Install Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: py-${{ steps.setup_python.outputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Determine package directory
        id: package_dir
        shell: bash
        run: |
          if [ -d "polars-cv" ]; then
            echo "dir=polars-cv" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.package_dir.outputs.dir }}
        run: |
          # See the test job: skip the discarded release-LTO project build; the
          # `maturin develop` (debug) step below is the only extension build.
          uv sync --group dev --no-install-project

      - name: Build extension and run slow tests
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        run: |
          source .venv/bin/activate
          maturin develop
          # Only the slow-marked tests; still skip network ones.
          pytest tests/ -v --tb=short -m "slow and not network"

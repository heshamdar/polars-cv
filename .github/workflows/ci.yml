name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow the slow/OOC lane to be kicked manually and run on a weekly cadence.
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Clear .cargo/config.toml's per-x86_64 `target-cpu=x86-64-v3` rustflags so
  # CI builds are portable and reproducible. RUSTFLAGS (not CARGO_BUILD_RUSTFLAGS)
  # is required: an empty CARGO_BUILD_RUSTFLAGS is treated as unset and falls
  # back to the config file, leaving target-cpu baked in on x86_64 runners.
  RUSTFLAGS: ""

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run only ubuntu-latest on PRs to save costs
        # Run full matrix on main branch
        os: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
            && fromJSON('["ubuntu-latest", "macos-latest"]')
            || fromJSON('["ubuntu-latest"]')
          }}
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test view-buffer (all features)
        # The main "Build and Test" step runs from the polars-cv crate dir, so it
        # only tests that crate with default features — view-buffer's feature-gated
        # modules (image_interop/arrow/polars/perceptual_hash/serde) are never
        # exercised. Run them explicitly. Scoped to -p view-buffer so polars-cv's
        # pyo3-extension feature (which unlinks libpython) is not activated.
        run: cargo test -p view-buffer --all-features

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Determine package directory
        id: package_dir
        shell: bash
        run: |
          if [ -d "polars-cv" ]; then
            echo "dir=polars-cv" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.package_dir.outputs.dir }}
        run: |
          uv sync --group dev

      - name: Build and Test (Rust & Python)
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        run: |
          source .venv/bin/activate

          echo "=== Running Rust Tests ==="
          cargo test

          echo "=== Building Python Extension ==="
          # Build with all features enabled (cloud support is now default)
          maturin develop

          echo "=== Running Python Tests ==="
          # Exclude network-marked tests: they hit external services (httpbin.org)
          # and flake when those are down (e.g. HTTP 503), which with -x aborts the
          # whole suite. Run them out-of-band, not as a CI gate.
          # Exclude slow-marked tests (e.g. test_streaming_ooc.py): heavier,
          # subprocess-based out-of-core verification not needed on every PR.
          pytest tests/ -x -v --tb=short -m "not network and not slow"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check formatting and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Python Lint (Ruff)
        run: |
          if [ -d "polars-cv" ]; then cd polars-cv; fi
          uvx ruff check python tests benchmarks
          uvx ruff format --check python tests benchmarks

  slow-tests:
    name: Slow / OOC tests
    # Off the per-PR critical path: the slow-marked tests (e.g.
    # test_streaming_ooc.py) spawn subprocesses for out-of-core verification.
    # Run them on manual dispatch and the weekly schedule instead.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Determine package directory
        id: package_dir
        shell: bash
        run: |
          if [ -d "polars-cv" ]; then
            echo "dir=polars-cv" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.package_dir.outputs.dir }}
        run: |
          uv sync --group dev

      - name: Build extension and run slow tests
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        run: |
          source .venv/bin/activate
          maturin develop
          # Only the slow-marked tests; still skip network ones.
          pytest tests/ -v --tb=short -m "slow and not network"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: rust-lang/setup-rust-action@v1
        with:
          rust-version: stable
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check polars-cv/python polars-cv/tests polars-cv/benchmarks

      - name: Ruff format check
        run: ruff format --check polars-cv/python polars-cv/tests polars-cv/benchmarks

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # With abi3-py39, one wheel works for all Python 3.9+ versions
        # Test on minimum (3.9) and latest (3.12) to verify compatibility
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: rust-lang/setup-rust-action@v1
        with:
          rust-version: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install maturin
        run: pip install maturin

      - name: Build and install polars-cv
        working-directory: polars-cv
        run: |
          pip install -e ".[dev]"
          maturin develop --release

      - name: Run tests (fail-fast)
        working-directory: polars-cv
        run: pytest tests/ -x -v --tb=short

  build:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: rust-lang/setup-rust-action@v1
        with:
          rust-version: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build workspace
        run: cargo build --release

      - name: Run Rust tests
        run: cargo test --release


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # With abi3-py39, one wheel works for all Python 3.9+ versions
        # Test on minimum (3.9) and latest (3.13) to verify compatibility
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        working-directory: polars-cv
        run: uv venv .venv

      - name: Install maturin
        working-directory: polars-cv
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          uv pip install maturin

      - name: Build package with maturin
        working-directory: polars-cv
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          # Maturin should find python/ relative to pyproject.toml (we're in polars-cv/)
          maturin develop --release

      - name: Install test dependencies
        working-directory: polars-cv
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          uv pip install pytest polars numpy pillow opencv-python scipy imagehash

      - name: Run tests
        working-directory: polars-cv
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pytest tests/ -x -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check formatting
        run: cargo fmt --all -- --check || exit 1

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings || exit 1

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        working-directory: polars-cv
        run: uv venv .venv

      - name: Install ruff
        working-directory: polars-cv
        shell: bash
        run: |
          source .venv/bin/activate
          uv pip install ruff

      - name: Ruff check
        working-directory: polars-cv
        shell: bash
        run: |
          source .venv/bin/activate
          ruff check python tests benchmarks || exit 1

      - name: Ruff format check
        working-directory: polars-cv
        shell: bash
        run: |
          source .venv/bin/activate
          ruff format --check python tests benchmarks || exit 1

  build:
    name: Build verification
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build workspace
        run: cargo build --release || exit 1

      - name: Run Rust tests
        run: cargo test --release || exit 1

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_BUILD_RUSTFLAGS: ""   # disable target-cpu=native for reproducible CI/wheel builds

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Run only ubuntu-latest on PRs to save costs
        # Run full matrix on main branch
        os: >-
          ${{
            (github.event_name == 'push' && github.ref == 'refs/heads/main')
            && fromJSON('["ubuntu-latest", "macos-latest"]')
            || fromJSON('["ubuntu-latest"]')
          }}
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Test view-buffer (all features)
        # The main "Build and Test" step runs from the polars-cv crate dir, so it
        # only tests that crate with default features — view-buffer's feature-gated
        # modules (image_interop/arrow/polars/perceptual_hash/serde) are never
        # exercised. Run them explicitly. Scoped to -p view-buffer so polars-cv's
        # pyo3-extension feature (which unlinks libpython) is not activated.
        run: cargo test -p view-buffer --all-features

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Determine package directory
        id: package_dir
        shell: bash
        run: |
          if [ -d "polars-cv" ]; then
            echo "dir=polars-cv" >> $GITHUB_OUTPUT
          else
            echo "dir=." >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        working-directory: ${{ steps.package_dir.outputs.dir }}
        run: |
          uv sync --group dev

      - name: Build and Test (Rust & Python)
        working-directory: ${{ steps.package_dir.outputs.dir }}
        shell: bash
        run: |
          source .venv/bin/activate

          echo "=== Running Rust Tests ==="
          cargo test

          echo "=== Building Python Extension ==="
          # Build with all features enabled (cloud support is now default)
          maturin develop

          echo "=== Running Python Tests ==="
          pytest tests/ -x -v --tb=short

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Check formatting and clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Python Lint (Ruff)
        run: |
          if [ -d "polars-cv" ]; then cd polars-cv; fi
          uvx ruff check python tests benchmarks
          uvx ruff format --check python tests benchmarks

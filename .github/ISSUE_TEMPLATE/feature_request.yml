name: Feature request
description: A new operation, parameter, source/sink format or integration.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and how you do it today (another library, a Python loop, a workaround).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: How you would like to write it with polars-cv. If an equivalent exists elsewhere (OpenCV, scikit-image, torchvision), link it. Its definition doubles as the reference test.
      render: python
  - type: textarea
    id: context
    attributes:
      label: Anything else

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: local
    hooks:
      # Python lint + format, run through the *same* `uvx ruff` CI's lint job
      # uses (`.github/workflows/ci.yml`) rather than the `ruff-pre-commit`
      # mirror, which pins its own ruff at a fixed rev. That pin drifted from
      # CI's unpinned `uvx ruff` -- the mirror sat at v0.9.2 while `uvx`
      # resolved 0.15.x -- so code the hook formatted locally still failed CI's
      # `ruff format --check`. Two ruff versions is the second authority
      # CLAUDE.md forbids; one `uvx ruff` means passing the hook is passing CI.
      #
      # The invocation and paths are byte-identical to `scripts/verify.sh` and
      # CI's lint job, so `--check` (not autofix) gates exactly what CI gates;
      # run `uvx ruff check --fix` / `uvx ruff format` by hand to fix in place.
      # `test_the_precommit_hook_runs_the_ci_python_linters` pins this parity.
      - id: ruff-check
        name: ruff check
        description: Lint Python (matches CI's `uvx ruff check`)
        entry: uvx ruff check polars-cv/python polars-cv/tests polars-cv/benchmarks
        language: system
        files: \.py$
        pass_filenames: false

      - id: ruff-format
        name: ruff format --check
        description: Check Python formatting (matches CI's `uvx ruff format --check`)
        entry: uvx ruff format --check polars-cv/python polars-cv/tests polars-cv/benchmarks
        language: system
        files: \.py$
        pass_filenames: false

      - id: cargo-fmt
        name: cargo fmt
        description: Check Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy on Rust code
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      # The structural guards: single-authority ratchets, registry parity,
      # removed-surface pins, doc vocabularies. ~650 tests in about five
      # seconds, which is what makes them affordable here rather than only in
      # CI.
      #
      # This lane needs the compiled extension. 427 of the 651 are
      # `@plugin_required` -- many structural facts are only observable through
      # the FFI, such as the enum-parity sweep reading `enum_variants` -- and
      # without a `.so` they do not politely skip: sixteen fail outright and
      # `test_schema_parity_chains.py` aborts collection, because its
      # `parametrize` reads `_lib` at import time. So this hook assumes the
      # working tree you are committing from has been built, which is the same
      # thing `scripts/verify.sh` assumes.
      #
      # `files:` deliberately spans Python, Rust, Markdown and the workflow
      # files: a guard comparing a doc table to a Rust enum is broken by an
      # edit to either end, so scoping this to one language would let half the
      # breakages through.
      - id: structural-checks
        name: structural guards
        description: Run the codebase-shape guards (pytest -m structural)
        # `--no-sync` matters here: without it `uv run` re-syncs the project,
        # which rebuilds the Rust extension -- minutes, on every commit. These
        # guards read the source tree and never touch the extension, so the
        # existing venv is exactly what they need.
        entry: uv run --no-sync --directory polars-cv pytest tests/ -q -m "structural and not slow"
        language: system
        files: \.(py|rs|md|toml|ya?ml)$
        pass_filenames: false

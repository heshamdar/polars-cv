repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.2
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Check Rust formatting
        entry: cargo fmt --all -- --check
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Run clippy on Rust code
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false

      # The structural guards: single-authority ratchets, registry parity,
      # removed-surface pins, doc vocabularies. ~650 tests in about five
      # seconds, which is what makes them affordable here rather than only in
      # CI.
      #
      # This lane needs the compiled extension. 427 of the 651 are
      # `@plugin_required` -- many structural facts are only observable through
      # the FFI, such as the enum-parity sweep reading `enum_variants` -- and
      # without a `.so` they do not politely skip: sixteen fail outright and
      # `test_schema_parity_chains.py` aborts collection, because its
      # `parametrize` reads `_lib` at import time. So this hook assumes the
      # working tree you are committing from has been built, which is the same
      # thing `scripts/verify.sh` assumes.
      #
      # `files:` deliberately spans Python, Rust, Markdown and the workflow
      # files: a guard comparing a doc table to a Rust enum is broken by an
      # edit to either end, so scoping this to one language would let half the
      # breakages through.
      - id: structural-checks
        name: structural guards
        description: Run the codebase-shape guards (pytest -m structural)
        # `--no-sync` matters here: without it `uv run` re-syncs the project,
        # which rebuilds the Rust extension -- minutes, on every commit. These
        # guards read the source tree and never touch the extension, so the
        # existing venv is exactly what they need.
        entry: uv run --no-sync --directory polars-cv pytest tests/ -q -m "structural and not slow"
        language: system
        files: \.(py|rs|md|toml|ya?ml)$
        pass_filenames: false
